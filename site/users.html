<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudBase Demo · 用户管理</title>
  <link rel="stylesheet" href="common.css" />
</head>
<body>
  <nav class="navbar">
    <span class="logo">CloudBase Demo</span>
    <a class="nav-link" data-nav="index.html" href="index.html">首页</a>
    <a class="nav-link" data-nav="users.html" href="users.html">用户管理</a>
    <a class="nav-link" data-nav="todos.html" href="todos.html">待办清单</a>
    <a class="nav-link" data-nav="about.html" href="about.html">关于项目</a>
  </nav>

  <div class="container">
    <h1>用户管理</h1>
    <p class="subtitle">数据来自 HTTP 云函数 <code>http-demo</code> 的 <code>/api/users</code>（内存存储）</p>

    <div class="card">
      <h2 style="margin-top:0">新增 / 编辑用户</h2>
      <div class="row grow">
        <input id="f-name" placeholder="姓名" maxlength="40" />
        <input id="f-email" placeholder="邮箱" maxlength="80" />
        <select id="f-role">
          <option value="viewer">viewer</option>
          <option value="editor">editor</option>
          <option value="admin">admin</option>
        </select>
        <button id="btn-submit">新增</button>
        <button class="ghost" id="btn-cancel" style="display:none">取消编辑</button>
      </div>
    </div>

    <div class="card">
      <div class="row grow" style="margin-bottom:12px">
        <input id="f-keyword" placeholder="搜索姓名或邮箱" maxlength="40" />
        <select id="f-filter-role">
          <option value="">全部角色</option>
          <option value="admin">admin</option>
          <option value="editor">editor</option>
          <option value="viewer">viewer</option>
        </select>
        <button class="ghost" id="btn-search">查询</button>
      </div>

      <table>
        <thead>
          <tr><th>ID</th><th>姓名</th><th>邮箱</th><th>角色</th><th>创建时间</th><th style="width:120px">操作</th></tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
      <p class="muted" id="total-tip"></p>
    </div>
  </div>

  <script src="common.js"></script>
  <script>
    var editingId = null
    var tbody = document.getElementById('table-body')

    function buildQuery() {
      var qs = []
      var keyword = document.getElementById('f-keyword').value.trim()
      var role = document.getElementById('f-filter-role').value
      if (keyword) qs.push('q=' + encodeURIComponent(keyword))
      if (role) qs.push('role=' + encodeURIComponent(role))
      return qs.length ? '?' + qs.join('&') : ''
    }

    async function loadUsers() {
      try {
        var data = await api.get('/api/users' + buildQuery())
        tbody.innerHTML = data.items.map(function (u) {
          return '<tr>' +
            '<td>' + u.id + '</td>' +
            '<td>' + escapeHtml(u.name) + '</td>' +
            '<td>' + escapeHtml(u.email) + '</td>' +
            '<td><span class="badge">' + escapeHtml(u.role) + '</span></td>' +
            '<td class="muted">' + escapeHtml(String(u.createdAt).slice(0, 10)) + '</td>' +
            '<td><button class="ghost" data-edit="' + u.id + '">编辑</button> ' +
            '<button class="danger" data-del="' + u.id + '">删除</button></td>' +
            '</tr>'
        }).join('') || '<tr><td colspan="6" class="muted">暂无数据</td></tr>'
        document.getElementById('total-tip').textContent = '共 ' + data.total + ' 条，第 ' + data.page + ' 页 / 每页 ' + data.pageSize + ' 条'
      } catch (e) {
        toast(e.message, 'error')
      }
    }

    function resetForm() {
      editingId = null
      document.getElementById('f-name').value = ''
      document.getElementById('f-email').value = ''
      document.getElementById('f-role').value = 'viewer'
      document.getElementById('btn-submit').textContent = '新增'
      document.getElementById('btn-cancel').style.display = 'none'
    }

    document.getElementById('btn-submit').addEventListener('click', async function () {
      var payload = {
        name: document.getElementById('f-name').value.trim(),
        email: document.getElementById('f-email').value.trim(),
        role: document.getElementById('f-role').value
      }
      try {
        if (editingId) {
          await api.put('/api/users/' + editingId, payload)
          toast('更新成功')
        } else {
          await api.post('/api/users', payload)
          toast('新增成功')
        }
        resetForm()
        loadUsers()
      } catch (e) {
        toast(e.message, 'error')
      }
    })

    document.getElementById('btn-cancel').addEventListener('click', resetForm)
    document.getElementById('btn-search').addEventListener('click', loadUsers)
    document.getElementById('f-keyword').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') loadUsers()
    })

    tbody.addEventListener('click', async function (e) {
      var editId = e.target.getAttribute && e.target.getAttribute('data-edit')
      var delId = e.target.getAttribute && e.target.getAttribute('data-del')

      if (editId) {
        var user = await api.get('/api/users/' + editId)
        editingId = Number(editId)
        document.getElementById('f-name').value = user.name
        document.getElementById('f-email').value = user.email
        document.getElementById('f-role').value = user.role
        document.getElementById('btn-submit').textContent = '保存'
        document.getElementById('btn-cancel').style.display = ''
        return
      }

      if (delId) {
        if (!confirm('确认删除该用户？')) return
        try {
          await api.del('/api/users/' + delId)
          toast('已删除')
          loadUsers()
        } catch (e) {
          toast(e.message, 'error')
        }
      }
    })

    loadUsers()
  </script>
</body>
</html>
